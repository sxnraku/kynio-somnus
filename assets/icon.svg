<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect width="1024" height="1024" fill="#161412" rx="224" />
  <!-- Celestial 24H Horizon -->
  <line x1="152" y1="512" x2="872" y2="512" stroke="#332D26" stroke-width="3" />
  <line x1="512" y1="152" x2="512" y2="872" stroke="#332D26" stroke-width="2" />
  <!-- Outer Ring -->
  <circle cx="512" cy="512" r="360" fill="none" stroke="#332D26" stroke-width="4" />
  <!-- 90-Min Harmonic Inner Circle -->
  <circle cx="512" cy="512" r="180" fill="none" stroke="#4A4237" stroke-width="2" />
  <!-- Day Arc (Top 180 deg) -->
  <path d="M 242 512 A 270 270 0 0 1 782 512" fill="none" stroke="#D9922E" stroke-width="5" />
  <!-- Night Arc (Bottom 180 deg) -->
  <path d="M 782 512 A 270 270 0 0 1 242 512" fill="none" stroke="#4A4237" stroke-width="3" />
  <!-- Major Astronomical Ticks -->
  <line x1="512" y1="152" x2="512" y2="184" stroke="#E8A83E" stroke-width="4" />
  <line x1="512" y1="840" x2="512" y2="872" stroke="#9E9789" stroke-width="4" />
  <line x1="152" y1="512" x2="184" y2="512" stroke="#9E9789" stroke-width="4" />
  <line x1="840" y1="512" x2="872" y2="512" stroke="#9E9789" stroke-width="4" />
  <!-- SCN Hub Center -->
  <circle cx="512" cy="512" r="12" fill="#E8A83E" />
  <circle cx="512" cy="512" r="4" fill="#161412" />
  <!-- Nadir Point (Rest) -->
  <circle cx="512" cy="782" r="24" fill="#221E1A" stroke="#D9922E" stroke-width="3" />
  <circle cx="512" cy="782" r="8" fill="#D9922E" />
  <!-- Zenith Solar Sun Anchor -->
  <circle cx="512" cy="242" r="78" fill="none" stroke="#D9922E" stroke-width="2" />
  <line x1="512" y1="144" x2="512" y2="162" stroke="#E8A83E" stroke-width="3" />
  <line x1="512" y1="322" x2="512" y2="340" stroke="#E8A83E" stroke-width="3" />
  <line x1="414" y1="242" x2="432" y2="242" stroke="#E8A83E" stroke-width="3" />
  <line x1="592" y1="242" x2="610" y2="242" stroke="#E8A83E" stroke-width="3" />
  <circle cx="512" cy="242" r="54" fill="#D9922E" stroke="#E8A83E" stroke-width="3" />
  <circle cx="512" cy="242" r="20" fill="#F5B24D" />
</svg>